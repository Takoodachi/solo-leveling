apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// The watch app (Wear OS, for the owner's Galaxy Watch): the workout the phone app is running, with
// the rest counting down, what's next and the workout's time. Built by npm run android with the
// phone app, from the same build number, and installed on the watch over Wi-Fi (README).
def apkBuild = (file('../../src/lib/apkBuild.ts').text =~ /build: (\d+)/)[0][1] as Integer

android {
    namespace = "io.github.takoodachi.sololeveling.wear"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        // The phone app's id: the Data Layer only links an app to its own counterpart (same id, same signing key)
        applicationId "io.github.takoodachi.sololeveling"
        minSdkVersion 30 // Wear OS 3, the first on Galaxy watches
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode apkBuild
        versionName "build ${apkBuild}"
        // src/androidTest: the card, the rest's alarm and the screen, on any emulator (README → Watch app)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation "androidx.core:core-ktx:$androidxCoreVersion"
    // The workout's icon on the watch face while it runs
    implementation 'androidx.wear:wear-ongoing:1.0.0'
    // The tile (WorkoutTile): its layout, and the clock it counts by itself
    implementation 'androidx.wear.tiles:tiles:1.4.1'
    implementation 'androidx.wear.protolayout:protolayout:1.2.1'
    implementation 'androidx.wear.protolayout:protolayout-expression:1.2.1'
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}
